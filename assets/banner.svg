<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (Behind Text) -->
  
  <!-- Glowing Data Waves -->
  <path d="M -100 280 Q 200 180 500 270 T 1100 220 T 1300 300" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.4" filter="url(#glow)">
    <animate attributeName="d" dur="10s" repeatCount="indefinite"
      values="M -100 280 Q 200 180 500 270 T 1100 220 T 1300 300;
              M -100 250 Q 250 310 550 210 T 1050 280 T 1300 240;
              M -100 280 Q 200 180 500 270 T 1100 220 T 1300 300" />
  </path>
  
  <path d="M -100 310 Q 300 230 650 300 T 1200 200" fill="none" stroke="#10b981" stroke-width="2" opacity="0.3" filter="url(#glow)">
    <animate attributeName="d" dur="12s" repeatCount="indefinite"
      values="M -100 310 Q 300 230 650 300 T 1200 200;
              M -100 270 Q 350 190 600 260 T 1200 310;
              M -100 310 Q 300 230 650 300 T 1200 200" />
  </path>

  <!-- Background Radar / Scanning Circles (Right side accent) -->
  <g transform="translate(1020, 180)" opacity="0.25">
    <circle r="120" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="4 4" />
    <circle r="80" fill="none" stroke="#34d399" stroke-width="1" />
    <circle r="40" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="-140" y1="0" x2="140" y2="0" stroke="#818cf8" stroke-width="1" />
    <line x1="0" y1="-140" x2="0" y2="140" stroke="#818cf8" stroke-width="1" />
    <polygon points="0,0 70,-70 100,-30" fill="url(#bgGrad)" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite" />
    </polygon>
  </g>

  <!-- Shield Security Graphic Accent (Left side background element) -->
  <g transform="translate(120, 180)" opacity="0.15">
    <path d="M 0 -90 L 75 -45 V 30 C 75 75 0 105 0 105 C 0 105 -75 75 -75 30 V -45 Z" fill="none" stroke="#6366f1" stroke-width="4" filter="url(#glow)"/>
    <path d="M 0 -70 L 55 -35 V 20 C 55 55 0 80 0 80 C 0 80 -55 55 -55 20 V -35 Z" fill="none" stroke="#10b981" stroke-width="2"/>
  </g>

  <!-- Pulse Alert Dots -->
  <circle cx="880" cy="110" r="4" fill="#ef4444" filter="url(#glow)">
    <animate attributeName="r" values="3;8;3" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="940" cy="260" r="5" fill="#10b981" filter="url(#glow)">
    <animate attributeName="r" values="4;9;4" dur="2.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="280" cy="80" r="4" fill="#6366f1" filter="url(#glow)">
    <animate attributeName="r" values="2;6;2" dur="3s" repeatCount="indefinite" />
  </circle>

  <!-- FOREGROUND CONTENT (Guaranteed High Contrast & Visibility) -->

  <!-- Top Category Tag / Badge -->
  <g transform="translate(600, 75)">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" filter="url(#softGlow)" />
    <text x="0" y="5" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.5" text-anchor="middle">
      CURATED ECOSYSTEM &amp; FRAMEWORKS
    </text>
  </g>

  <!-- Main Title -->
  <text x="600" y="160" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" text-anchor="middle" filter="url(#softGlow)">
    Awesome Fraud Detection in Banking 💳✨
  </text>

  <!-- Subtitle -->
  <text x="600" y="210" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">
    Real-Time Transaction Fraud • Behavioral Analytics • ATO Prevention • Risk Scoring
  </text>

  <!-- Decorative Feature Pills (Bottom Foreground) -->
  <g transform="translate(600, 275)">
    <!-- Pill 1 -->
    <g transform="translate(-270, 0)">
      <rect x="-90" y="-16" width="180" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
        🏢 Enterprise SaaS
      </text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(-90, 0)">
      <rect x="-75" y="-16" width="150" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
        ⚡ Real-Time ML
      </text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(90, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
        🔓 Open-Source
      </text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(270, 0)">
      <rect x="-80" y="-16" width="160" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
        🛡️ RiskOps &amp; AML
      </text>
    </g>
  </g>
</svg>
